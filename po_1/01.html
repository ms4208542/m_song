<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login_wrap">
        <div class="login">
            <div class="login_box">
                <div class="login_title">
                    <h1 style="color: #529f65; font-weight: bold;font-size: 28px;letter-spacing: 2px">WELCOME!</h1>
                    <p style="font-weight: bold;color:#6b6b6b;font-size: 14px;padding-left: 2px; padding-top:5px ">LOGIN TO CONTINUE</p>
                </div>
                <div class="i_p">
                    <label class="in_t" for="id">ID</label>
                    <input class="login_id" id="id" type="text" placeholder="type your id"><br>
                    <label style="margin-top: 30px" class="in_t" for="pw">PASSWORD</label>
                    <input class="login_pw" id="pw" type="password" placeholder="type your password">
                </div>
                <div class="login_attribute">
                    <input class="lg_ck_box" type="checkbox" id="lg_check"><label class="lg_ck_p" for="lg_check">Remember me</label>
                    <a href="02.html"><button class="login_btn">LOGIN</button></a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
