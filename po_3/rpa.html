<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <title>rpa</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                line-height: 1px;
                overflow-x: hidden;
            }

            .rpa_wrap {
                width: 100%;
            }

            .rpa {
                width: 100%;
                margin: 0 auto;
            }

            .rpa > img {
                width: 100%;
                height: auto;
                display: block;
            }

            @media screen and (min-width: 320px) and (max-width: 430px) {
                .rpa_wrap {
                    width: 100%;
                }
                .rpa > img {
                    max-width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="rpa_wrap">
            <div class="rpa"><img src="03_rpa.jpg" alt=""></div>
        </div>
    </body>
</html>
