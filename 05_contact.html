    <svg style="display: none">
        <filter
            id="glass-distortion"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            filterunits="objectBoundingBox">
            <feturbulence
                type="fractalnoise"
                basefrequency="0.01 0.01"
                numoctaves="1"
                seed="5"
                result="turbulence"/>
            <fecomponenttransfer in="turbulence" result="mapped">
                <fefuncr type="gamma" amplitude="1" exponent="10" offset="0.5"/>
                <fefuncg type="gamma" amplitude="0" exponent="1" offset="0"/>
                <fefuncb type="gamma" amplitude="0" exponent="1" offset="0.5"/>
            </fecomponenttransfer>
            <fegaussianblur in="turbulence" stddeviation="3" result="softMap"/>
            <fespecularlighting
                in="softMap"
                surfacescale="5"
                specularconstant="1"
                specularexponent="100"
                lighting-color="white"
                result="specLight">
                <fepointlight x="-200" y="-200" z="300"/>
            </fespecularlighting>
            <fecomposite
                in="specLight"
                operator="arithmetic"
                k1="0"
                k2="1"
                k3="1"
                k4="0"
                result="litImage"/>
            <fedisplacementmap
                in="SourceGraphic"
                in2="softMap"
                scale="150"
                xchannelselector="R"
                ychannelselector="G"/>
        </filter>
    </svg>

    <script>

        const menuToggle = document.getElementById('menuToggle');
        const sideNav = document.getElementById('sideNav');

        menuToggle.addEventListener('click', () => {
            sideNav
                .classList
                .toggle('open');
        });
        document.addEventListener('DOMContentLoaded', () => {
            const options = {
                root: null,
                rootMargin: '0px',
                threshold: 0.2 // 약 20% 이상 보일 때 감지
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const target = entry.target;

                    if (entry.isIntersecting) {
                        // 보일 때 visible 클래스 붙임 (애니메이션 시작)
                        target
                            .querySelectorAll('.animate-item')
                            .forEach(el => {
                                el
                                    .classList
                                    .add('visible');
                            });
                    } else {
                        // 사라질 때 visible 클래스 제거 (애니메이션 초기화)
                        target
                            .querySelectorAll('.animate-item')
                            .forEach(el => {
                                el
                                    .classList
                                    .remove('visible');
                            });
                    }
                });
            }, options);

            const section = document.querySelector('#web_08 .bottom-section');
            if (section) {
                observer.observe(section);
            } else {
                console.error('bottom-section 요소를 찾을 수 없습니다.');
            }
        });
    </script>
